name: C++20 CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and run tests
        run: make test
      - name: Build application
        run: make
